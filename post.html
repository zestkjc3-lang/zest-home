<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>제스트에듀 ZESTEDU — 공지 · 블로그</title>

<link rel="icon" href="/favicon.ico?v=2" sizes="any" />
<link rel="shortcut icon" href="/favicon.ico?v=2" />
<link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32.png?v=2" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2" />
<link rel="manifest" href="/site.webmanifest" />
<meta name="msapplication-TileImage" content="/images/icon-192.png?v=2" />
<meta name="msapplication-TileColor" content="#ffffff" />
<meta name="description" content="제스트에듀 공지 · 블로그" />
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
<style>
  :root{
    --paper:#ffffff;--cream:#faf7f1;--cream-2:#f3ede1;
    --ink:#1c1a15;--text:#514c41;
    --muted:#8b8574;
    --line:#ece6d9;--line-2:#ddd5c3;
    --gold:#9c7c3c;--gold-deep:#7c6127;
    --mark:#ffe56a;
    --wine:#7d2f36;--wine-soft:#f6ecec;
    --maxw:820px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Pretendard Variable",Pretendard,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--text);background:#f7f4ec;line-height:1.7;-webkit-font-smoothing:antialiased;letter-spacing:-0.02em}
  a{color:inherit;text-decoration:none}
  img{display:block;max-width:100%;height:auto}

  header{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.92);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
  .bar{max-width:var(--maxw);margin:0 auto;padding:14px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px}
  .back{display:inline-flex;align-items:center;gap:6px;font-weight:800;font-size:14.5px;color:var(--ink)}
  .back:hover{color:var(--gold-deep)}
  .title{font-size:14.5px;font-weight:800;color:var(--ink)}
  .btn{display:inline-flex;align-items:center;justify-content:center;padding:12px 20px;border-radius:999px;font-weight:700;font-size:14.5px;background:var(--gold);color:#fff;border:0;transition:.15s}
  .btn:hover{background:var(--gold-deep)}
  .btn.ghost{background:#fff;color:var(--ink);border:1.5px solid var(--line-2)}
  .btn.ghost:hover{border-color:var(--ink);background:var(--cream)}

  main{max-width:var(--maxw);margin:0 auto;padding:20px 16px 56px}
  .panel{background:var(--paper);border-radius:20px;overflow:hidden;border:1px solid var(--line);box-shadow:0 18px 48px -28px rgba(28,26,21,.28)}
  .panel img{width:100%;height:auto;display:block;max-width:100%;object-fit:contain}

  .article{margin-top:22px;background:var(--paper);border-radius:20px;border:1px solid var(--line);padding:38px 30px 44px;box-shadow:0 14px 40px -28px rgba(28,26,21,.22)}
  .eyebrow{display:inline-block;font-size:12.5px;font-weight:800;letter-spacing:.14em;color:var(--wine);margin-bottom:10px}
  .article h1{font-size:clamp(24px,4.4vw,32px);font-weight:900;color:var(--ink);letter-spacing:-.04em;line-height:1.32;margin-bottom:18px}
  .article h2{font-size:18px;font-weight:900;color:var(--ink);letter-spacing:-.03em;margin:8px 0 16px;text-align:center}
  .lead p{font-size:17px;color:#2a271f;line-height:1.9;margin:0 0 .9em}
  .lead p:last-child{margin-bottom:0}
  .em{font-weight:800;color:var(--ink)}
  .mark{background:var(--mark);padding:0 .12em;box-decoration-break:clone;-webkit-box-decoration-break:clone}

  .hook{margin:28px 0 8px;padding:22px 18px;text-align:center;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
  .hook p{font-size:clamp(18px,3.4vw,22px);font-weight:800;color:var(--wine);letter-spacing:-.03em;line-height:1.45}

  .reasons{list-style:none;display:flex;flex-direction:column;gap:14px;margin:22px 0 8px}
  .reasons li{background:var(--cream);border:1px solid var(--line);border-radius:18px;padding:20px 20px 18px}
  .reasons .num{display:inline-flex;align-items:center;justify-content:center;min-width:28px;height:28px;border-radius:999px;background:var(--wine);color:#fff;font-size:13px;font-weight:800;margin-right:8px;vertical-align:middle}
  .reasons h3{display:inline;font-size:17px;font-weight:800;color:var(--ink);letter-spacing:-.025em;line-height:1.5}
  .reasons p{font-size:15.5px;color:#3a362d;line-height:1.85;margin:10px 0 0}

  .process{margin-top:36px;padding-top:8px}
  .steps{list-style:none;display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  .steps li{background:linear-gradient(180deg,#fff,var(--cream));border:1px solid var(--line);border-radius:18px;padding:20px 16px 18px;text-align:center}
  .steps .kicker{display:inline-block;font-size:11.5px;font-weight:800;letter-spacing:.16em;color:var(--gold);margin-bottom:8px}
  .steps h3{font-size:16.5px;font-weight:800;color:var(--ink);letter-spacing:-.03em;margin-bottom:8px;line-height:1.4}
  .steps p{font-size:14.5px;color:#3a362d;line-height:1.75;text-align:left}
  .steps .flow{display:none;background:none;border:0;padding:0}

  .closing{margin-top:32px;padding:24px 22px 22px;background:var(--wine-soft);border-radius:18px}
  .closing p{font-size:16.5px;color:#2a271f;line-height:1.9;margin:0 0 .85em}
  .closing p:last-child{margin-bottom:0;font-weight:700;color:var(--ink)}

  .actions{margin-top:24px;display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
  .note{margin-top:16px;text-align:center;font-size:13.5px;color:var(--muted)}

  @media(max-width:720px){
    .steps{grid-template-columns:1fr}
    .steps .flow{display:block;text-align:center;color:var(--gold);font-weight:800;margin:2px 0}
  }
  @media(max-width:560px){
    .article{padding:26px 18px 32px}
    .title{display:none}
    .reasons li{padding:18px 16px 16px}
    .closing{padding:20px 16px}
  }

  .sec-title{font-size:20px;font-weight:900;color:var(--ink);letter-spacing:-.03em;margin:34px 0 10px}
  .body p{font-size:16.5px;color:#2a271f;line-height:1.9;margin:0 0 .9em}
  .body .fig{margin:22px 0;border-radius:16px;overflow:hidden;border:1px solid var(--line);background:var(--cream)}
  .body .fig img{width:100%;height:auto}
  .body .fig figcaption{padding:10px 14px;font-size:14px;color:var(--muted);text-align:center}
  .body .list{margin:6px 0 18px;padding-left:22px}
  .body .list li{font-size:16px;line-height:1.85;color:#2a271f;margin:2px 0}
  .body .hook{margin:26px 0}
  .body .closing{margin:24px 0}
  .hidden{display:none!important}
  .empty-msg{padding:60px 20px;text-align:center;color:var(--muted);line-height:1.8}
</style>
</head>
<body>
  <header>
    <div class="bar">
      <a class="back" href="index.html">← 홈으로</a>
      <span class="title" id="barTitle">공지 · 블로그</span>
      <a class="btn" href="index.html#contact">상담문의</a>
    </div>
  </header>

  <main>
    <div class="panel hidden" id="cover"><img id="coverImg" alt="" /></div>

    <article class="article" id="article">
      <span class="eyebrow" id="eyebrow"></span>
      <h1 id="title"></h1>
      <div class="body" id="body"></div>
    </article>

    <div class="actions">
      <a class="btn" href="index.html#contact">상담 문의하기</a>
      <a class="btn ghost hidden" id="blogBtn" href="#" target="_blank" rel="noopener">블로그 원문 보기 ↗</a>
      <a class="btn ghost" href="index.html">홈으로 돌아가기</a>
    </div>
    <p class="note">부천 상동역 7번출구 뱅뱅프라자 806, 807호 · 032-327-2287</p>
  </main>

<script>
// 관리자 화면(/admin)의 「글 쓰기」에서 쓴 글을 보여 주는 공용 페이지: post.html?id=글아이디
(function(){
  var $=function(id){return document.getElementById(id);};
  var params=new URLSearchParams(location.search),id=params.get('id')||'';
  var EDIT_MODE=window.parent!==window&&params.get('edit')==='1';
  function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  function asset(p){return String(p||'').replace(/^\//,'');}
  // **굵게**, ==형광펜== 만 꾸밈으로 바꾸고 나머지는 글자 그대로
  function inline(t){
    return esc(t).replace(/\*\*(.+?)\*\*/g,'<span class="em">$1</span>').replace(/==(.+?)==/g,'<span class="mark">$1</span>').replace(/\n/g,'<br>');
  }
  function block(b){
    var t=b&&b.t;
    if(t==='h')return b.text?'<h2 class="sec-title">'+inline(b.text)+'</h2>':'';
    if(t==='p')return b.text?b.text.split(/\n{2,}/).map(function(p){return '<p>'+inline(p)+'</p>';}).join(''):'';
    if(t==='img')return b.src?'<figure class="fig"><img src="'+esc(asset(b.src))+'" alt="'+esc(b.caption||'')+'" loading="lazy"/>'+(b.caption?'<figcaption>'+esc(b.caption)+'</figcaption>':'')+'</figure>':'';
    if(t==='quote')return b.text?'<div class="hook"><p>'+inline(b.text)+'</p></div>':'';
    if(t==='list'){var li=(b.items||[]).filter(Boolean);return li.length?'<ul class="list">'+li.map(function(x){return '<li>'+inline(x)+'</li>';}).join('')+'</ul>':'';}
    if(t==='note')return b.text?'<div class="closing">'+b.text.split(/\n{2,}/).map(function(p){return '<p>'+inline(p)+'</p>';}).join('')+'</div>':'';
    return '';
  }
  function render(a){
    if(!a){
      $('cover').classList.add('hidden');
      $('article').innerHTML='<div class="empty-msg">글을 찾을 수 없어요.<br><a href="index.html" style="font-weight:800;color:var(--gold-deep)">홈으로 가기</a></div>';
      return;
    }
    var plain=String(a.title||'').replace(/\*\*|==/g,'')||'공지 · 블로그';
    document.title=plain+' — 제스트에듀';
    $('barTitle').textContent=plain;
    $('coverImg').alt=plain;
    $('cover').classList.toggle('hidden',!a.cover);
    if(a.cover)$('coverImg').src=asset(a.cover);
    $('eyebrow').textContent=a.eyebrow||'';
    $('eyebrow').classList.toggle('hidden',!a.eyebrow);
    $('title').innerHTML=inline(a.title||'(제목 없음)');
    $('body').innerHTML=(a.blocks||[]).map(block).join('');
    $('blogBtn').classList.toggle('hidden',!a.blog);
    if(a.blog)$('blogBtn').href=a.blog;
  }
  if(EDIT_MODE){
    // 관리자 화면 미리보기: 쓰는 내용을 그대로 받아 그린다
    window.addEventListener('message',function(e){
      if(e.origin!==location.origin||e.source!==window.parent||!e.data)return;
      if(e.data.type==='zest-article')render(e.data.article);
    });
    document.addEventListener('click',function(e){if(e.target.closest('a'))e.preventDefault();},true);
    window.parent.postMessage({type:'zest-ready',page:'post'},location.origin);
    return;
  }
  // 관리자 화면 미리보기 안에서 카드·배너를 눌러 온 경우: 아직 저장 안 한 글도 관리자 화면에서 받아 보여 준다
  var fromAdmin=false,inAdmin=false;
  try{inAdmin=window.parent!==window&&window.parent.location.origin===location.origin&&/\/admin\//.test(window.parent.location.pathname);}catch(e){}
  if(inAdmin){
    window.addEventListener('message',function(e){
      if(e.origin!==location.origin||e.source!==window.parent||!e.data)return;
      if(e.data.type==='zest-article'&&e.data.article){fromAdmin=true;render(e.data.article);}
    });
    window.parent.postMessage({type:'zest-need-article',id:id},location.origin);
  }
  fetch('data/articles.json',{cache:'no-cache'})
    .then(function(r){if(!r.ok)throw new Error(r.status);return r.json();})
    .then(function(d){if(!fromAdmin)render(((d&&d.items)||[]).filter(function(a){return a.id===id;})[0]);})
    .catch(function(){if(!fromAdmin)render(null);});
})();
</script>
</body>
</html>

<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>제스트에듀 ZESTEDU — 공지 · 블로그</title>
<link rel="icon" href="/favicon.ico?v=2" sizes="any" />
<link rel="shortcut icon" href="/favicon.ico?v=2" />

<style>
  @font-face{font-family:'GmarketSansLight';src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2001@1.1/GmarketSansLight.woff') format('woff');}
  @font-face{font-family:'GmarketSansMedium';src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2001@1.1/GmarketSansMedium.woff') format('woff');}
  @font-face{font-family:'GmarketSansBold';src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2001@1.1/GmarketSansBold.woff') format('woff');}
  /* 공통 틀 (머리글·버튼·바닥글) */
:root{--paper:#ffffff;--cream:#faf7f1;--cream-2:#f3ede1;
    --ink:#1c1a15;--text:#514c41;
    --muted:#8b8574;
    --line:#ece6d9;--line-2:#ddd5c3;
    --gold:#9c7c3c;--gold-deep:#7c6127;
    --mark:#ffe56a;
    --wine:#7d2f36;--wine-soft:#f6ecec;
    --maxw:820px;}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Pretendard Variable",Pretendard,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--text);background:#f7f4ec;line-height:1.7;-webkit-font-smoothing:antialiased;letter-spacing:-0.02em}
a{color:inherit;text-decoration:none}
img{display:block;max-width:100%;height:auto}
header{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.92);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.bar{max-width:var(--maxw);margin:0 auto;padding:14px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.back{display:inline-flex;align-items:center;gap:6px;font-weight:800;font-size:14.5px;color:var(--ink)}
.back:hover{color:var(--gold-deep)}
.title{font-size:14.5px;font-weight:800;color:var(--ink)}
.btn{display:inline-flex;align-items:center;justify-content:center;padding:12px 20px;border-radius:999px;font-weight:700;font-size:14.5px;background:var(--gold);color:#fff;border:0;transition:.15s}
.btn:hover{background:var(--gold-deep)}
.btn.ghost{background:#fff;color:var(--ink);border:1.5px solid var(--line-2)}
.btn.ghost:hover{border-color:var(--ink);background:var(--cream)}
main{max-width:var(--maxw);margin:0 auto;padding:20px 16px 56px}
.actions{margin-top:24px;display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.note{margin-top:16px;text-align:center;font-size:13.5px;color:var(--muted)}
@media(max-width:560px){.title{display:none}}
  /* 새로 쓴 글의 디자인 칸 (옮겨 온 옛 글에는 적용 안 함: 옛 글은 자기 스타일을 css 로 가짐) */
:is(#content:not(.legacy),#content .zbox) .panel{background:var(--paper);border-radius:20px;overflow:hidden;border:1px solid var(--line);box-shadow:0 18px 48px -28px rgba(28,26,21,.28)}
:is(#content:not(.legacy),#content .zbox) .panel img{width:100%;height:auto;display:block;max-width:100%;object-fit:contain}
:is(#content:not(.legacy),#content .zbox) .article{margin-top:22px;background:var(--paper);border-radius:20px;border:1px solid var(--line);padding:38px 30px 44px;box-shadow:0 14px 40px -28px rgba(28,26,21,.22)}
:is(#content:not(.legacy),#content .zbox) .eyebrow{display:inline-block;font-size:12.5px;font-weight:800;letter-spacing:.14em;color:var(--wine);margin-bottom:10px}
:is(#content:not(.legacy),#content .zbox) .article h1{font-size:clamp(24px,4.4vw,32px);font-weight:900;color:var(--ink);letter-spacing:-.04em;line-height:1.32;margin-bottom:18px}
:is(#content:not(.legacy),#content .zbox) .article h2{font-size:18px;font-weight:900;color:var(--ink);letter-spacing:-.03em;margin:8px 0 16px;text-align:center}
:is(#content:not(.legacy),#content .zbox) .lead p{font-size:17px;color:#2a271f;line-height:1.9;margin:0 0 .9em}
:is(#content:not(.legacy),#content .zbox) .lead p:last-child{margin-bottom:0}
:is(#content:not(.legacy),#content .zbox) .em{font-weight:800;color:var(--ink)}
:is(#content:not(.legacy),#content .zbox) .mark{background:var(--mark);padding:0 .12em;box-decoration-break:clone;-webkit-box-decoration-break:clone}
:is(#content:not(.legacy),#content .zbox) .hook{margin:28px 0 8px;padding:22px 18px;text-align:center;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
:is(#content:not(.legacy),#content .zbox) .hook p{font-size:clamp(18px,3.4vw,22px);font-weight:800;color:var(--wine);letter-spacing:-.03em;line-height:1.45}
:is(#content:not(.legacy),#content .zbox) .reasons{list-style:none;display:flex;flex-direction:column;gap:14px;margin:22px 0 8px}
:is(#content:not(.legacy),#content .zbox) .reasons li{background:var(--cream);border:1px solid var(--line);border-radius:18px;padding:20px 20px 18px}
:is(#content:not(.legacy),#content .zbox) .reasons .num{display:inline-flex;align-items:center;justify-content:center;min-width:28px;height:28px;border-radius:999px;background:var(--wine);color:#fff;font-size:13px;font-weight:800;margin-right:8px;vertical-align:middle}
:is(#content:not(.legacy),#content .zbox) .reasons h3{display:inline;font-size:17px;font-weight:800;color:var(--ink);letter-spacing:-.025em;line-height:1.5}
:is(#content:not(.legacy),#content .zbox) .reasons p{font-size:15.5px;color:#3a362d;line-height:1.85;margin:10px 0 0}
:is(#content:not(.legacy),#content .zbox) .process{margin-top:36px;padding-top:8px}
:is(#content:not(.legacy),#content .zbox) .steps{list-style:none;display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
:is(#content:not(.legacy),#content .zbox) .steps li{background:linear-gradient(180deg,#fff,var(--cream));border:1px solid var(--line);border-radius:18px;padding:20px 16px 18px;text-align:center}
:is(#content:not(.legacy),#content .zbox) .steps .kicker{display:inline-block;font-size:11.5px;font-weight:800;letter-spacing:.16em;color:var(--gold);margin-bottom:8px}
:is(#content:not(.legacy),#content .zbox) .steps h3{font-size:16.5px;font-weight:800;color:var(--ink);letter-spacing:-.03em;margin-bottom:8px;line-height:1.4}
:is(#content:not(.legacy),#content .zbox) .steps p{font-size:14.5px;color:#3a362d;line-height:1.75;text-align:left}
:is(#content:not(.legacy),#content .zbox) .steps .flow{display:none;background:none;border:0;padding:0}
:is(#content:not(.legacy),#content .zbox) .closing{margin-top:32px;padding:24px 22px 22px;background:var(--wine-soft);border-radius:18px}
:is(#content:not(.legacy),#content .zbox) .closing p{font-size:16.5px;color:#2a271f;line-height:1.9;margin:0 0 .85em}
:is(#content:not(.legacy),#content .zbox) .closing p:last-child{margin-bottom:0;font-weight:700;color:var(--ink)}
@media(max-width:720px){:is(#content:not(.legacy),#content .zbox) .steps{grid-template-columns:1fr}
:is(#content:not(.legacy),#content .zbox) .steps .flow{display:block;text-align:center;color:var(--gold);font-weight:800;margin:2px 0}}
@media(max-width:560px){:is(#content:not(.legacy),#content .zbox) .article{padding:26px 18px 32px}
:is(#content:not(.legacy),#content .zbox) .reasons li{padding:18px 16px 16px}
:is(#content:not(.legacy),#content .zbox) .closing{padding:20px 16px}}
:is(#content:not(.legacy),#content .zbox) .sec-title{font-size:19px;font-weight:900;color:var(--ink);letter-spacing:-.03em;margin:34px 0 4px}
:is(#content:not(.legacy),#content .zbox) .sec-sub{font-size:14.5px;color:var(--muted);margin-bottom:6px}
:is(#content:not(.legacy),#content .zbox) .pair{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:18px 0 6px}
:is(#content:not(.legacy),#content .zbox) .pair figure{margin:0;background:var(--cream);border:1px solid var(--line);border-radius:16px;overflow:hidden}
:is(#content:not(.legacy),#content .zbox) .pair img{width:100%;height:auto}
:is(#content:not(.legacy),#content .zbox) .pair figcaption{padding:12px 14px 14px;font-size:14.5px;line-height:1.7;color:#3a362d}
:is(#content:not(.legacy),#content .zbox) .pair figcaption b{display:block;color:var(--ink);font-size:15.5px;margin-bottom:2px}
:is(#content:not(.legacy),#content .zbox) .hits{list-style:none;margin:16px 0 4px;border:1px solid var(--line);border-radius:16px;overflow:hidden}
:is(#content:not(.legacy),#content .zbox) .hits li{display:grid;grid-template-columns:150px 1fr;gap:12px;padding:12px 16px;border-top:1px solid var(--line);font-size:15px;line-height:1.6}
:is(#content:not(.legacy),#content .zbox) .hits li:first-child{border-top:0}
:is(#content:not(.legacy),#content .zbox) .hits li:nth-child(odd){background:var(--cream)}
:is(#content:not(.legacy),#content .zbox) .hits b{color:var(--wine)}
:is(#content:not(.legacy),#content .zbox) .steps.four{grid-template-columns:repeat(2,1fr)}
:is(#content:not(.legacy),#content .zbox) .tags{margin:14px 0 0;display:flex;flex-wrap:wrap;gap:6px}
:is(#content:not(.legacy),#content .zbox) .tags span{font-size:13.5px;font-weight:700;background:var(--wine-soft);color:var(--wine);padding:4px 10px;border-radius:999px}
@media(max-width:720px){:is(#content:not(.legacy),#content .zbox) .pair{grid-template-columns:1fr}
:is(#content:not(.legacy),#content .zbox) .hits li{grid-template-columns:1fr;gap:2px}
:is(#content:not(.legacy),#content .zbox) .steps.four{grid-template-columns:1fr}}
:is(#content:not(.legacy),#content .zbox) .gallery{display:grid;grid-template-columns:repeat(var(--cols,2),1fr);gap:12px;margin:16px 0 6px}
:is(#content:not(.legacy),#content .zbox) .gallery figure{margin:0;background:var(--cream);border:1px solid var(--line);border-radius:14px;overflow:hidden}
:is(#content:not(.legacy),#content .zbox) .gallery img{width:100%;height:auto;background:#fff}
:is(#content:not(.legacy),#content .zbox) .gallery figcaption{padding:10px 12px;font-size:14px;font-weight:700;color:var(--ink);text-align:center}
:is(#content:not(.legacy),#content .zbox) .gallery a{display:block}
@media(max-width:720px){:is(#content:not(.legacy),#content .zbox) .gallery{gap:8px}
:is(#content:not(.legacy),#content .zbox) .gallery figcaption{font-size:12.5px;padding:8px 6px}}
  /* ---- 공용 글 페이지 추가 스타일 ---- */
  .hidden{display:none!important}
  :where(:is(#content:not(.legacy),#content .zbox)) .fig{margin:22px 0;border-radius:16px;overflow:hidden;border:1px solid var(--line);background:var(--cream)}
  :where(:is(#content:not(.legacy),#content .zbox)) .fig img{width:100%;height:auto;margin:0 auto}
  :where(:is(#content:not(.legacy),#content .zbox)) .fig figcaption{padding:10px 14px;font-size:14px;color:var(--muted);text-align:center}
  :where(:is(#content:not(.legacy),#content .zbox) .article) ul:not([class]),:where(:is(#content:not(.legacy),#content .zbox) .article) ol:not([class]){margin:6px 0 18px;padding-left:24px}
:where(:is(#content:not(.legacy),#content .zbox) .article ul:not([class]),:is(#content:not(.legacy),#content .zbox) .article ol:not([class])) li{font-size:16px;line-height:1.85;color:#2a271f;margin:2px 0}
  :where(:is(#content:not(.legacy),#content .zbox) .article) p{font-size:16.5px;color:#2a271f;line-height:1.9;margin:0 0 .9em}
  :where(:is(#content:not(.legacy),#content .zbox) .article) hr{border:0;border-top:1px solid var(--line);margin:26px 0}
  :where(:is(#content:not(.legacy),#content .zbox) .article) a:not(.btn){color:var(--gold-deep);text-decoration:underline}
  :where(:is(#content:not(.legacy),#content .zbox) .article) h3:not([class]){font-size:18px;font-weight:800;color:var(--ink);margin:22px 0 8px}
  .empty-msg{padding:60px 20px;text-align:center;color:var(--muted);line-height:1.8}

  /* ---- 관리자 미리보기 편집 모드 ---- */
  body.editing header{position:static}
  body.editing #content{outline:none;min-height:300px}
  body.editing #content:focus-within{outline:2px dashed rgba(47,111,237,.35);outline-offset:6px;border-radius:12px}
  body.editing #content img{cursor:pointer}
  body.editing #content img.sel{outline:3px solid #2f6fed;outline-offset:2px}
  #tb{position:sticky;top:0;z-index:30;background:#fff;border-bottom:1px solid #e3e0d8;box-shadow:0 6px 16px -12px rgba(0,0,0,.35);padding:8px 10px;display:flex;flex-wrap:wrap;gap:4px;align-items:center;font-family:Pretendard,sans-serif}
  #tb .grp{display:flex;gap:2px;align-items:center;padding-right:6px;margin-right:4px;border-right:1px solid #ece8de}
  #tb .grp:last-child{border-right:0}
  #tb button,#tb select{height:32px;min-width:32px;border:1px solid transparent;background:#fff;border-radius:8px;font:600 13.5px Pretendard,sans-serif;color:#1c1a15;padding:0 7px;cursor:pointer}
  #tb button:hover,#tb select:hover{background:#f3f1ea;border-color:#e3e0d8}
  #tb select{border-color:#e3e0d8}
  #tb .ic{font-size:15px}
  #tb .wide{padding:0 10px}
  .pop{position:absolute;z-index:40;background:#fff;border:1px solid #e3e0d8;border-radius:12px;box-shadow:0 14px 30px -12px rgba(0,0,0,.35);padding:10px;font-family:Pretendard,sans-serif}
  .pop .sw{display:grid;grid-template-columns:repeat(6,26px);gap:6px}
  .pop .sw button{width:26px;height:26px;border-radius:6px;border:1px solid rgba(0,0,0,.12);cursor:pointer;padding:0}
  .pop .menu button{display:block;width:100%;text-align:left;border:0;background:none;padding:9px 10px;border-radius:8px;font:600 14px Pretendard,sans-serif;cursor:pointer;color:#1c1a15}
  .pop .menu button small{display:block;font-weight:500;color:#8b8574;font-size:12px}
  .pop .menu button:hover{background:#f3f1ea}
  .pop .lbl{font-size:12px;color:#8b8574;margin:0 0 6px;font-weight:700}
  #imgTools{position:absolute;z-index:35;display:flex;gap:4px;background:#1c1a15;border-radius:10px;padding:5px;box-shadow:0 10px 24px -10px rgba(0,0,0,.5)}
  #imgTools button{border:0;background:transparent;color:#fff;font:700 12.5px Pretendard,sans-serif;padding:6px 9px;border-radius:7px;cursor:pointer}
  #imgTools button:hover{background:rgba(255,255,255,.15)}
  .edit-hint{max-width:var(--maxw);margin:10px auto 0;padding:0 16px;font:500 13px Pretendard,sans-serif;color:#8b8574}
</style>
</head>
<body>
  <header>
    <div class="bar">
      <a class="back" href="index.html">← 홈으로</a>
      <span class="title" id="barTitle">공지 · 블로그</span>
      <a class="btn" href="index.html#contact">상담문의</a>
    </div>
  </header>

  <main>
    <div id="content"></div>

    <div class="actions">
      <a class="btn" href="index.html#contact">상담 문의하기</a>
      <a class="btn ghost hidden" id="blogBtn" href="#" target="_blank" rel="noopener">블로그 원문 보기 ↗</a>
      <a class="btn ghost" href="index.html">홈으로 돌아가기</a>
    </div>
    <p class="note">부천 상동역 7번출구 뱅뱅프라자 806, 807호 · 032-327-2287</p>
  </main>

<script>
// 공용 글 페이지: post.html?id=글아이디
// - 글 데이터: data/articles.json 의 { id, title, html, css, blog }
//   html = 본문 전체(사진·제목·디자인 칸 포함), css = 옮겨 온 옛 페이지 고유 스타일(.art-아이디 안에서만 적용)
// - 관리자 화면(/admin) 미리보기에서 ?edit=1 로 열리면 본문을 바로 고칠 수 있는 편집기가 된다
(function(){
  var $=function(id){return document.getElementById(id);};
  var params=new URLSearchParams(location.search),id=params.get('id')||'';
  var origin=location.origin;
  var EDIT=window.parent!==window&&params.get('edit')==='1';
  var inAdmin=false;
  try{inAdmin=window.parent!==window&&window.parent.location.origin===origin&&/\/admin\//.test(window.parent.location.pathname);}catch(e){}
  var styleEl=document.createElement('style');document.head.appendChild(styleEl);
  var content=$('content'),current=null;

  function clean(html){
    if(!window.DOMPurify)return html;
    return DOMPurify.sanitize(html,{ADD_ATTR:['target','loading'],FORBID_TAGS:['script','style','iframe','form','input','textarea','select','button']});
  }
  function plainTitle(a){
    var t=a&&a.title;
    if(!t&&a&&a.html){var d=document.createElement('div');d.innerHTML=a.html;var h=d.querySelector('h1');t=h?h.textContent:'';}
    return String(t||'').replace(/\s+/g,' ').trim()||'공지 · 블로그';
  }
  function render(a){
    current=a||null;
    if(!a){
      styleEl.textContent='';
      content.className='';
      content.innerHTML='<div class="article"><div class="empty-msg">글을 찾을 수 없어요.<br><a href="index.html" style="font-weight:800;color:var(--gold-deep)">홈으로 가기</a></div></div>';
      $('blogBtn').classList.add('hidden');
      return;
    }
    var plain=plainTitle(a);
    document.title=plain+' — 제스트에듀';
    $('barTitle').textContent=plain;
    styleEl.textContent=a.css||'';
    content.className='art-'+String(a.id||'').replace(/[^\w-]/g,'')+(a.css?' legacy':'');
    content.innerHTML=clean(a.html||'');
    content.querySelectorAll('a[href^="http"]').forEach(function(x){x.target='_blank';x.rel='noopener';});
    updateBlog(a);
  }
  function updateBlog(a){
    $('blogBtn').classList.toggle('hidden',!a.blog);
    if(a.blog)$('blogBtn').href=a.blog;
  }

  if(EDIT){startEditor();return;}

  // 관리자 미리보기 안에서 카드·배너를 눌러 온 경우: 저장 전 글도 관리자 화면에서 받아 보여 준다
  var fromAdmin=false;
  if(inAdmin){
    window.addEventListener('message',function(e){
      if(e.origin!==origin||e.source!==window.parent||!e.data)return;
      if(e.data.type==='zest-article'&&e.data.article){fromAdmin=true;render(e.data.article);}
    });
    window.parent.postMessage({type:'zest-need-article',id:id},origin);
    // 홈페이지 미리보기처럼 글 왼쪽 위에 「✏️ 수정」 버튼 → 누르면 이 글 편집으로 바뀐다
    var eb=document.createElement('button');eb.type='button';eb.className='zest-edit-btn';eb.textContent='눌러서 수정';
    eb.addEventListener('click',function(){window.parent.postMessage({type:'zest-article-open',id:id},origin);});
    var st=document.createElement('style');
    st.textContent='main{position:relative}.zest-edit-anchor{position:absolute;top:14px;left:14px;z-index:30;opacity:0;pointer-events:none}.zest-edit-btn{border:0;border-radius:999px;background:#2f6fed;color:#fff;font:700 13px/1 Pretendard,sans-serif;padding:8px 12px;cursor:pointer;box-shadow:0 4px 12px -4px rgba(0,0,0,.45)}main:hover{outline:3px solid #2f6fed;outline-offset:3px}main:hover .zest-edit-anchor,main:focus-within .zest-edit-anchor{opacity:1;pointer-events:auto}.zest-edit-btn:hover{background:#1f57c9}';
    document.head.appendChild(st);
    var anchor=document.createElement('div');anchor.className='zest-edit-anchor';anchor.appendChild(eb);content.before(anchor);
  }
  fetch('data/articles.json',{cache:'no-cache'})
    .then(function(r){if(!r.ok)throw new Error(r.status);return r.json();})
    .then(function(d){if(!fromAdmin)render(((d&&d.items)||[]).filter(function(a){return a.id===id;})[0]);})
    .catch(function(){if(!fromAdmin)render(null);});

  // =====================================================================
  // 편집기 (관리자 미리보기 전용)
  // =====================================================================
  function startEditor(){
    document.body.classList.add('editing');
    var ready=false,notifyTimer=null,lastRange=null;
    var hint=document.createElement('p');hint.className='edit-hint';
    hint.textContent='✏️ 아래 글을 바로 눌러서 고치세요. 위 도구 막대로 글씨체·크기·색·사진·디자인 상자를 넣을 수 있어요.';
    document.querySelector('header').after(hint);

    window.addEventListener('message',function(e){
      if(e.origin!==origin||e.source!==window.parent||!e.data)return;
      if(e.data.type!=='zest-article')return;
      var a=e.data.article;
      if(!a){render(null);return;}
      // 쓰는 중에는 본문을 다시 그리지 않는다(커서가 튀지 않게). 처음·다른 글·되돌리기 때만 다시 그린다
      if(!ready||e.data.force||!current||current.id!==a.id){render(a);enable();ready=true;}
      else{current=a;updateBlog(a);}
    });
    window.parent.postMessage({type:'zest-ready',page:'post',id:id},origin);

    function enable(){
      content.contentEditable='true';
      content.spellcheck=false;
    }
    // ---- 내용이 바뀌면 관리자 화면에 알린다 ----
    function serialize(){
      var c=content.cloneNode(true);
      c.querySelectorAll('.sel').forEach(function(x){x.classList.remove('sel');if(!x.className)x.removeAttribute('class');});
      c.querySelectorAll('[contenteditable]').forEach(function(x){x.removeAttribute('contenteditable');});
      return c.innerHTML;
    }
    function notify(now){
      clearTimeout(notifyTimer);
      var send=function(){if(current)window.parent.postMessage({type:'zest-article-edit',id:current.id,html:serialize()},origin);};
      if(now)send();else notifyTimer=setTimeout(send,250);
    }
    content.addEventListener('input',function(){notify();});

    // ---- 선택 영역 기억 (도구 막대를 눌러도 선택이 사라지지 않게) ----
    document.addEventListener('selectionchange',function(){
      var s=window.getSelection();
      if(s.rangeCount&&content.contains(s.getRangeAt(0).commonAncestorContainer))lastRange=s.getRangeAt(0).cloneRange();
    });
    function restore(){
      content.focus({preventScroll:true});
      if(lastRange){var s=window.getSelection();s.removeAllRanges();s.addRange(lastRange);}
    }
    function exec(cmd,val){
      restore();
      document.execCommand('styleWithCSS',false,true);
      document.execCommand(cmd,false,val==null?null:val);
      notify();
    }
    // 옮겨 온 옛 글에는 새 글 디자인이 꺼져 있으므로, 새로 넣는 상자·사진은 .zbox 로 감싸 새 글 디자인을 받게 한다
    function boxed(html){return content.classList.contains('legacy')?'<div class="zbox">'+html+'</div><p><br></p>':html;}
    function insertHTML(html){restore();document.execCommand('insertHTML',false,html);notify();}

    // 글자 크기: 브라우저 기본 명령은 7단계뿐이라, 가장 큰 단계로 적용한 뒤 원하는 px 로 바꾼다
    function setFontSize(px){
      exec('fontSize','7');
      content.querySelectorAll('span[style*="font-size"],font[size="7"]').forEach(function(el){
        var fs=el.style.fontSize;
        if(el.tagName==='FONT'||fs==='xxx-large'||fs==='-webkit-xxx-large'){
          var sp=el;
          if(el.tagName==='FONT'){sp=document.createElement('span');sp.innerHTML=el.innerHTML;el.replaceWith(sp);}
          sp.style.fontSize=px+'px';sp.style.lineHeight='1.5';
        }
      });
      notify();
    }
    function setBlock(tag,cls){
      exec('formatBlock',tag);
      var s=window.getSelection();if(!s.rangeCount)return;
      var n=s.getRangeAt(0).startContainer;n=n.nodeType===1?n:n.parentNode;
      var blk=n.closest(tag);
      if(blk&&content.contains(blk)){if(cls)blk.className=cls;else blk.removeAttribute('class');}
      notify();
    }

    // ---- 사진 ----
    function readImage(file){
      return new Promise(function(resolve,reject){
        if(!/^image\/(png|jpeg|webp)$/.test(file.type))return reject(new Error('JPG, PNG, WEBP 사진만 넣을 수 있어요.'));
        var fr=new FileReader();
        fr.onerror=function(){reject(new Error('사진을 읽지 못했어요.'));};
        fr.onload=function(){
          var url=fr.result,img=new Image();
          img.onerror=function(){reject(new Error('사진을 열지 못했어요.'));};
          img.onload=function(){
            var MAX=1600;
            if(img.naturalWidth<=MAX&&file.size<=1.2*1024*1024)return resolve(url);
            var w=Math.min(MAX,img.naturalWidth),h=Math.round(img.naturalHeight*w/img.naturalWidth);
            var c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);
            resolve(file.type==='image/png'?c.toDataURL('image/png'):c.toDataURL('image/jpeg',0.88));
          };
          img.src=url;
        };
        fr.readAsDataURL(file);
      });
    }
    function pickImage(cb){
      var inp=document.createElement('input');inp.type='file';inp.accept='image/png,image/jpeg,image/webp';
      inp.onchange=function(){var f=inp.files&&inp.files[0];if(f)readImage(f).then(cb).catch(function(e){alert(e.message);});};
      inp.click();
    }
    function figureHTML(src){return '<figure class="fig"><img src="'+src+'" alt=""><figcaption>사진 설명 (지워도 돼요)</figcaption></figure><p><br></p>';}

    // 사진을 누르면 크기·바꾸기·지우기 도구
    var tools=document.createElement('div');tools.id='imgTools';tools.className='hidden';
    [['작게','40%'],['중간','70%'],['원래 크기','']].forEach(function(o){
      var b=document.createElement('button');b.type='button';b.textContent=o[0];
      b.onmousedown=function(e){e.preventDefault();if(selImg){selImg.style.width=o[1];selImg.style.display=o[1]?'block':'';selImg.style.marginLeft=o[1]?'auto':'';selImg.style.marginRight=o[1]?'auto':'';placeTools();notify(true);}};
      tools.appendChild(b);
    });
    var bSwap=document.createElement('button');bSwap.type='button';bSwap.textContent='사진 바꾸기';
    bSwap.onmousedown=function(e){e.preventDefault();var im=selImg;if(im)pickImage(function(u){im.src=u;notify(true);});};
    tools.appendChild(bSwap);
    var bDel=document.createElement('button');bDel.type='button';bDel.textContent='🗑 지우기';
    bDel.onmousedown=function(e){e.preventDefault();if(!selImg)return;var f=selImg.closest('figure');(f&&content.contains(f)&&f.querySelectorAll('img').length===1?f:selImg).remove();selImg=null;tools.classList.add('hidden');notify(true);};
    tools.appendChild(bDel);
    document.body.appendChild(tools);
    var selImg=null;
    function placeTools(){
      if(!selImg)return;var r=selImg.getBoundingClientRect();
      tools.style.left=(window.scrollX+r.left+8)+'px';tools.style.top=(window.scrollY+r.top+8)+'px';
    }
    content.addEventListener('click',function(e){
      var im=e.target.closest('img');
      content.querySelectorAll('img.sel').forEach(function(x){x.classList.remove('sel');});
      if(im&&content.contains(im)){selImg=im;im.classList.add('sel');tools.classList.remove('hidden');placeTools();}
      else{selImg=null;tools.classList.add('hidden');}
      if(e.target.closest('a'))e.preventDefault();
    });
    window.addEventListener('scroll',placeTools);window.addEventListener('resize',placeTools);

    // 붙여넣기: 사진 파일은 사진으로, 다른 곳에서 복사한 글은 꾸밈을 정리해서 넣는다
    content.addEventListener('paste',function(e){
      var cd=e.clipboardData;if(!cd)return;
      var file=[].slice.call(cd.files||[]).filter(function(f){return /^image\//.test(f.type);})[0];
      if(file){e.preventDefault();readImage(file).then(function(u){insertHTML(boxed(figureHTML(u)));}).catch(function(err){alert(err.message);});return;}
      var html=cd.getData('text/html');
      if(html&&window.DOMPurify){
        e.preventDefault();
        insertHTML(DOMPurify.sanitize(html,{ALLOWED_TAGS:['p','br','b','strong','i','em','u','s','a','ul','ol','li','h2','h3','blockquote'],ALLOWED_ATTR:['href']}));
        return;
      }
      var t=cd.getData('text/plain');
      if(t){e.preventDefault();restore();document.execCommand('insertText',false,t);notify();}
    });
    content.addEventListener('keydown',function(e){if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='s'){e.preventDefault();notify(true);}});

    // ---- 도구 막대 ----
    var tb=document.createElement('div');tb.id='tb';
    document.body.insertBefore(tb,document.body.firstChild);
    function grp(){var g=document.createElement('div');g.className='grp';tb.appendChild(g);return g;}
    function btn(g,label,title,fn,cls){
      var b=document.createElement('button');b.type='button';b.innerHTML=label;b.title=title;if(cls)b.className=cls;
      b.addEventListener('mousedown',function(e){e.preventDefault();});
      b.addEventListener('click',function(e){fn(b,e);});
      g.appendChild(b);return b;
    }
    function sel(g,title,opts,fn){
      var s=document.createElement('select');s.title=title;
      opts.forEach(function(o){var op=document.createElement('option');op.value=o[0];op.textContent=o[1];s.appendChild(op);});
      s.addEventListener('change',function(){if(s.value!=='')fn(s.value);s.selectedIndex=0;});
      g.appendChild(s);return s;
    }
    var pop=null;
    function closePop(){if(pop){pop.remove();pop=null;}}
    document.addEventListener('mousedown',function(e){if(pop&&!pop.contains(e.target)&&!e.target.closest('#tb'))closePop();});
    function openPop(anchor,build){
      closePop();pop=document.createElement('div');pop.className='pop';build(pop);
      document.body.appendChild(pop);
      var r=anchor.getBoundingClientRect();
      pop.style.left=Math.min(window.scrollX+r.left,window.scrollX+window.innerWidth-pop.offsetWidth-10)+'px';
      pop.style.top=(window.scrollY+r.bottom+6)+'px';
    }
    function swatches(p,label,colors,fn){
      var l=document.createElement('div');l.className='lbl';l.textContent=label;p.appendChild(l);
      var w=document.createElement('div');w.className='sw';
      colors.forEach(function(c){
        var b=document.createElement('button');b.type='button';b.style.background=c;b.title=c;
        b.addEventListener('mousedown',function(e){e.preventDefault();});
        b.addEventListener('click',function(){fn(c);closePop();});
        w.appendChild(b);
      });
      p.appendChild(w);
    }
    var TEXT_COLORS=['#1c1a15','#514c41','#8b8574','#ffffff','#7d2f36','#c8463d','#e0663a','#b5852f','#9c7c3c','#2d5a4c','#1f6f63','#24497a','#2f6fed','#6b3fa0','#d6336c','#495057','#868e96','#000000'];
    var HILITES=['#ffe56a','#fff3bf','#ffd8a8','#ffc9c9','#d3f9d8','#c5f6fa','#d0ebff','#e5dbff','#f1f3f5','transparent'];

    var g1=grp();
    btn(g1,'↶','되돌리기 (⌘Z)',function(){exec('undo');});
    btn(g1,'↷','다시 하기 (⇧⌘Z)',function(){exec('redo');});

    var g2=grp();
    sel(g2,'글씨체',[['','글씨체'],['Pretendard, sans-serif','프리텐다드 (기본)'],['"Nanum Myeongjo", serif','나눔명조'],['GmarketSansMedium, sans-serif','G마켓 산스'],['GmarketSansBold, sans-serif','G마켓 산스 굵게']],function(v){exec('fontName',v);});
    sel(g2,'글씨 크기',[['','크기'],['13','아주 작게 13'],['15','작게 15'],['17','보통 17'],['20','크게 20'],['24','더 크게 24'],['30','아주 크게 30'],['38','제목 38']],function(v){setFontSize(+v);});

    var g3=grp();
    btn(g3,'<b>B</b>','굵게 (⌘B)',function(){exec('bold');});
    btn(g3,'<i>I</i>','기울임 (⌘I)',function(){exec('italic');});
    btn(g3,'<u>U</u>','밑줄 (⌘U)',function(){exec('underline');});
    btn(g3,'<s>S</s>','취소선',function(){exec('strikeThrough');});
    btn(g3,'<span style="border-bottom:3px solid #c8463d">가</span>','글자 색',function(b){openPop(b,function(p){swatches(p,'글자 색',TEXT_COLORS,function(c){exec('foreColor',c);});});});
    btn(g3,'<span style="background:#ffe56a;padding:0 3px">형광펜</span>','형광펜(배경색)',function(b){openPop(b,function(p){swatches(p,'형광펜 색 (마지막 칸 = 지우기)',HILITES,function(c){exec('hiliteColor',c);});});},'wide');

    var g4=grp();
    btn(g4,'<span class="ic">⇤</span>','왼쪽 정렬',function(){exec('justifyLeft');});
    btn(g4,'<span class="ic">↔</span>','가운데 정렬',function(){exec('justifyCenter');});
    btn(g4,'<span class="ic">⇥</span>','오른쪽 정렬',function(){exec('justifyRight');});
    btn(g4,'• 목록','점 목록',function(){exec('insertUnorderedList');},'wide');
    btn(g4,'1. 목록','번호 목록',function(){exec('insertOrderedList');},'wide');

    var g5=grp();
    btn(g5,'소제목','소제목으로 바꾸기',function(){setBlock('h2','sec-title');},'wide');
    btn(g5,'본문','보통 글로 바꾸기',function(){setBlock('p','');},'wide');
    btn(g5,'🔗 링크','글자에 링크 걸기',function(){
      var url=prompt('연결할 주소를 붙여넣으세요 (예: https://blog.naver.com/zestedu/...)');
      if(!url)return;if(!/^(https?:|mailto:|tel:|#|[\w.-]+\.html)/.test(url))url='https://'+url;
      exec('createLink',url);
    },'wide');
    btn(g5,'― 구분선','가로 구분선 넣기',function(){exec('insertHorizontalRule');},'wide');

    var g6=grp();
    btn(g6,'📷 사진','사진 넣기',function(){pickImage(function(u){insertHTML(boxed(figureHTML(u)));});},'wide');
    btn(g6,'🧩 디자인 상자 ▾','번호 카드·단계 상자 같은 디자인 칸 넣기',function(b){
      openPop(b,function(p){
        var m=document.createElement('div');m.className='menu';
        BOXES.forEach(function(o){
          var x=document.createElement('button');x.type='button';x.innerHTML=o[0]+'<small>'+o[1]+'</small>';
          x.addEventListener('mousedown',function(e){e.preventDefault();});
          x.addEventListener('click',function(){closePop();insertHTML(boxed(o[2]));});
          m.appendChild(x);
        });
        p.appendChild(m);
      });
    },'wide');
    btn(g6,'서식 지우기','고른 글자의 꾸밈 지우기',function(){exec('removeFormat');exec('unlink');},'wide');

    var PH='data:image/svg+xml;charset=utf-8,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="800" height="560"><rect width="100%" height="100%" fill="#f3ede1"/><text x="50%" y="50%" font-family="sans-serif" font-size="34" fill="#9c7c3c" text-anchor="middle" dominant-baseline="middle">사진을 누르고 「사진 바꾸기」</text></svg>');
    var BOXES=[
      ['번호 카드 목록','①②③ 번호가 붙은 설명 카드',
        '<ol class="reasons"><li><h3><span class="num">1</span>첫 번째 제목</h3><p>설명을 적어요.</p></li><li><h3><span class="num">2</span>두 번째 제목</h3><p>설명을 적어요.</p></li><li><h3><span class="num">3</span>세 번째 제목</h3><p>설명을 적어요.</p></li></ol><p><br></p>'],
      ['단계 상자 (3칸)','STEP 1 · 2 · 3 나란히',
        '<div class="process"><h2>단계 제목</h2><ol class="steps"><li><span class="kicker">STEP 1</span><h3>첫 단계</h3><p>설명</p></li><li><span class="kicker">STEP 2</span><h3>두 번째 단계</h3><p>설명</p></li><li><span class="kicker">STEP 3</span><h3>세 번째 단계</h3><p>설명</p></li></ol></div><p><br></p>'],
      ['질문·강조 문구','가운데 크게, 위아래 줄',
        '<div class="hook"><p>“강조하고 싶은 한 문장”</p></div><p><br></p>'],
      ['강조 상자','분홍 배경 상자 (마무리 말 등)',
        '<div class="closing"><p>강조하고 싶은 내용을 적어요.</p></div><p><br></p>'],
      ['사진 2칸 + 설명','학생 결과·상장 2개 나란히',
        '<div class="pair"><figure><img src="'+PH+'" alt=""><figcaption><b>이름 · 점수</b>설명을 적어요.</figcaption></figure><figure><img src="'+PH+'" alt=""><figcaption><b>이름 · 점수</b>설명을 적어요.</figcaption></figure></div><p><br></p>'],
      ['항목 표','왼쪽 항목 · 오른쪽 설명 줄무늬 표',
        '<ul class="hits"><li><b>항목 1</b><span>내용을 적어요</span></li><li><b>항목 2</b><span>내용을 적어요</span></li><li><b>항목 3</b><span>내용을 적어요</span></li></ul><p><br></p>'],
      ['큰 대표 사진 칸','맨 위 대표 사진처럼 테두리 있는 큰 사진',
        '<div class="panel"><img src="'+PH+'" alt=""></div><p><br></p>'],
      ['글 상자 (흰 바탕)','제목·본문을 담는 흰 카드',
        '<article class="article"><span class="eyebrow">작은 제목</span><h1>제목</h1><div class="lead"><p>내용을 적어요.</p></div></article><p><br></p>']
    ];
  }
})();
</script>
</body>
</html>

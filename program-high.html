<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>고등부 — 내신 + 모의고사 실전 — 제스트에듀</title>
<link rel="icon" href="/favicon.ico?v=2" sizes="any" />
<link rel="shortcut icon" href="/favicon.ico?v=2" />
<link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32.png?v=2" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2" />
<link rel="manifest" href="/site.webmanifest" />
<meta name="msapplication-TileImage" content="/images/icon-192.png?v=2" />
<meta name="msapplication-TileColor" content="#ffffff" />
<meta name="description" content="최다오답 — 모의고사 기출에서 가장 많이 틀린 문제만 골라 만든 제스트에듀 자체 교재. 고등 내신·모의고사 실전." />
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
<style>
  :root{
    --paper:#ffffff;--cream:#faf7f1;
    --ink:#1c1a15;--text:#514c41;
    --muted:#8b8574;
    --line:#ece6d9;--line-2:#ddd5c3;
    --gold:#9c7c3c;--gold-deep:#7c6127;
    --maxw:820px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Pretendard Variable",Pretendard,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--text);background:#f7f4ec;line-height:1.7;-webkit-font-smoothing:antialiased;letter-spacing:-0.02em}
  a{color:inherit;text-decoration:none}
  img{display:block;max-width:100%;height:auto}

  header{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.92);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
  .bar{max-width:var(--maxw);margin:0 auto;padding:14px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px}
  .back{display:inline-flex;align-items:center;gap:6px;font-weight:800;font-size:14.5px;color:var(--ink)}
  .back:hover{color:var(--gold-deep)}
  .title{font-size:14.5px;font-weight:800;color:var(--ink)}
  .btn{display:inline-flex;align-items:center;justify-content:center;padding:12px 20px;border-radius:999px;font-weight:700;font-size:14.5px;background:var(--gold);color:#fff;border:0;transition:.15s}
  .btn:hover{background:var(--gold-deep)}
  .btn.ghost{background:#fff;color:var(--ink);border:1.5px solid var(--line-2)}
  .btn.ghost:hover{border-color:var(--ink);background:var(--cream)}

  main{max-width:var(--maxw);margin:0 auto;padding:20px 16px 56px}
  .panel{background:var(--paper);border-radius:20px;overflow:hidden;border:1px solid var(--line);box-shadow:0 18px 48px -28px rgba(28,26,21,.28);display:grid;place-items:center;padding:24px 20px}
  .panel img{width:auto;max-width:100%;height:auto}

  .article{margin-top:22px;background:var(--paper);border-radius:20px;border:1px solid var(--line);padding:34px 28px 40px;box-shadow:0 14px 40px -28px rgba(28,26,21,.22)}
  .article h1{font-size:clamp(20px,3.8vw,26px);font-weight:900;color:var(--ink);letter-spacing:-.03em;line-height:1.45;margin-bottom:18px}
  .article p{font-size:16.5px;color:#2a271f;line-height:1.85;margin:0 0 1em}
  .figure{margin:18px 0 8px;border-radius:16px;overflow:hidden;border:1px solid var(--line);background:#fff}
  .figure img{width:100%;height:auto}

  .actions{margin-top:24px;display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
  .note{margin-top:16px;text-align:center;font-size:13.5px;color:var(--muted)}

  @media(max-width:560px){
    .article{padding:26px 18px 32px}
    .title{display:none}
  }
</style>
</head>
<body>
  <header>
    <div class="bar">
      <a class="back" href="index.html#program">← 홈으로</a>
      <span class="title">고등부</span>
      <a class="btn" href="index.html#contact">상담문의</a>
    </div>
  </header>

  <main>
    <div class="panel">
      <img src="images/program-high.png?v=3" alt="2026년 6월 모의고사 최다오답15 — 실전 훈련" width="1024" height="716" />
    </div>

    <article class="article">
      <h1>② 최다오답</h1>

      <p>‘최다오답’은 모의고사 기출에서 학생들이 가장 많이 틀린 문제만 골라 만든 자체 교재입니다.</p>

      <p>많은 문제를 푸는 것보다, 가장 어려운 유형을 집중 훈련해 사고력을 효율적으로 키웁니다.</p>

      <p>중위권 이상 학생이 자신의 페이스에 맞춰 실력을 끌어올리도록 최적화되어 있습니다.</p>

      <div class="figure">
        <img src="images/program-mid-choida.png?v=2" alt="최다오답 LEVEL 1 자체 교재" width="1710" height="1204" />
      </div>
    </article>

    <div class="actions">
      <a class="btn" href="index.html#contact">상담문의</a>
      <a class="btn ghost" href="index.html#program">홈으로 돌아가기</a>
    </div>
    <p class="note">부천 상동역 7번출구 뱅뱅프라자 806, 807호 · 032-327-2287</p>
  </main>
</body>
</html>
